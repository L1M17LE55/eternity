<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Eternity Modal</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
    }

    body {
      box-sizing: border-box;
      background-image:
        url('https://raw.githubusercontent.com/L1M17LE55/eternity/refs/heads/dev/assets/modal-background.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-clip: content-box;
      background-origin: content-box;
    }
  </style>

</head>

<body>

  <div id="method-data" data-payload="<?= payload ?>"></div>

  <p id="result">Loading...</p>

  <script>
    const { method, args } = JSON.parse(document.getElementById('method-data').dataset.payload)

    google.script.run
      .withSuccessHandler((result) => {
        document.getElementById('result').textContent
          = JSON.stringify(result, null, 2)
      })
      .withFailureHandler((error) => {
        document.getElementById('result').textContent = error.message
      })
      .invoke(method, ...args)
  </script>

</body>

</html>
