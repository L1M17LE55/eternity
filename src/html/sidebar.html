<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eternity Sidebar</title>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;

      background-image:
        url('https://raw.githubusercontent.com/L1M17LE55/eternity/refs/heads/dev/assets/sidebar-background.webp');

      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;

      /* Subtle top edge highlight like polished glass */
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);

      padding: 16px;
      box-sizing: border-box;

      .glow-petal,
      .glow-gold {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        /* Lets you click buttons right through them */
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }

      /* Pink sakura petal glow */
      .glow-petal {
        width: 6px;
        height: 4px;
        background: #ffd6f0;
        box-shadow: 0 0 10px 4px rgba(255, 150, 220, 0.85);
      }

      /* Warm golden sparkle glow */
      .glow-gold {
        width: 4px;
        height: 4px;
        background: #fff3c4;
        box-shadow: 0 0 12px 5px rgba(255, 200, 80, 0.85);
      }

      @keyframes pulseGlow {
        0% {
          opacity: 0.45;
          transform: scale(0.9);
        }

        100% {
          opacity: 1;
          transform: scale(1.25);
        }
      }
    }

    main {
      flex: 1;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-bottom: 8px;
    }
  </style>

</head>

<body>
  <main>
    <div class="sidebar-buttons">
      <div class="sidebar-action">
        <button id="update-tracker">Update tracker</button>
        <p>Genshin Impact <span>v<?= gameVersion ?></span> achievements are available!</p>
      </div>

      <div class="sidebar-action">
        <button id="import-progress">Import progress</button>
        <p>Transfer your achievement progress from your old Wonders of the World checklist.</p>
      </div>
    </div>

    <span class="glow-petal" style="top: 15%; left: 28%;"></span>
    <span class="glow-petal" style="top: 56%; left: 40%; animation-delay: 1s;"></span>
    <span class="glow-gold" style="top: 68%; left: 18%; animation-delay: 0.5s;"></span>
    <span class="glow-gold" style="top: 71%; left: 28%; animation-delay: 1.5s;"></span>

    <script>
      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach((button) => {
          button.disabled = disabled
        })
      }

      const updateButton = document.getElementById('update-tracker')
      updateButton.addEventListener('click', () => {
        disableButtons(true)

        google.script.run
          .withSuccessHandler(() => {
            disableButtons(false)
          })
          .withFailureHandler((error) => {
            disableButtons(false)
            console.error(error)
          })
          .invoke('updateTracker')
      })

      const importButton = document.getElementById('import-progress')
      importButton.addEventListener('click', () => {
        disableButtons(true)

        google.script.run
          .withSuccessHandler(() => {
            disableButtons(false)
          })
          .withFailureHandler((error) => {
            disableButtons(false)
            console.error(error)
          })
          .invoke('importProgress')
      })
    </script>

  </main>

  <footer class="sidebar-footer">
    <span>Version <?= bundleVersion ?></span>
  </footer>

</body>

</html>
