<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eternity Sidebar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cinzel+Decorative&family=Zen+Kaku+Gothic+New:wght@400;500&family=Orbitron&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      background-image:
        url('https://raw.githubusercontent.com/L1M17LE55/eternity/refs/heads/dev/assets/sidebar-background.webp');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    /* HEADER */
    header h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 400;
      letter-spacing: 0.28em;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0 6px #ffffff;
    }

    .title-initial {
      font-family: 'Cinzel', serif;
      font-size: 72px;
    }

    .title-rest {
      margin-left: -4px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 32px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 36px;
      margin-top: 24px;
      z-index: 1;
    }

    /* BUTTONS */
    .action button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 60%;
      margin: 0 auto;
      padding: 4px 0 0 0;
      border: none;

      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      letter-spacing: 0.2em;
      text-transform: uppercase;

      color: #ffffff;
      background: transparent;
      text-shadow: 0 0 6px rgba(255, 255, 255, 1);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .action button::after {
      content: "";
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 6px rgba(255, 255, 255, 1);
      mask-image: linear-gradient(to right,
          transparent 0%,
          black 20%,
          black 80%,
          transparent 100%);
      mask-size: 160% 100%;
      mask-position: center;
      mask-repeat: no-repeat;
      transition: 0.25s ease;
      transform: scaleY(0.5);
    }

    .action button:not(:disabled):hover {
      text-shadow:
        0 0 6px rgba(255, 255, 255, 1),
        0 0 12px rgba(255, 255, 255, 1);
    }

    .action button:not(:disabled):hover::after {
      width: 160%;
      mask-size: 100%;
    }

    .action button:disabled {
      color: rgba(255, 255, 255, 0.5);
      text-shadow: none;
      cursor: wait;
    }

    .action button:disabled::after {
      width: 100%;
      background: rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    .action-desc {
      margin-top: 8px;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(4px);
      mask-image: linear-gradient(to right,
          transparent 0%,
          black 10%,
          black 90%,
          transparent 100%);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: -2px 2px 4px rgba(0, 0, 0, 1);
    }

    /* FOOTER */
    footer {
      margin-top: auto;
      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>

  <style>
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      perspective: 700px;
    }

    .petal {
      position: absolute;
      top: -20px;
      width: 11px;
      height: 7px;
      background: linear-gradient(135deg, #fff2f9 0%, #ffc2e6 65%, #f495ce 100%);
      border-radius: 80% 15% 75% 25% / 75% 25% 80% 15%;
      box-shadow: 0 0 6px 1px rgba(255, 175, 230, 0.4);
      transform-style: preserve-3d;

      animation:
        fall linear infinite,
        drift ease-in-out infinite alternate,
        tumble ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -30px, 0);
        opacity: 0;
      }

      15% {
        opacity: var(--max-opacity, 0.8);
      }

      85% {
        opacity: var(--max-opacity, 0.75);
      }

      100% {
        transform: translate3d(var(--wind-drift, 80px), 108vh, 0);
        opacity: 0;
      }
    }

    @keyframes drift {
      0% {
        margin-left: -12px;
      }

      100% {
        margin-left: 12px;
      }
    }

    @keyframes tumble {
      0% {
        rotate: 0.8 0.5 0.2 -28deg;
      }

      50% {
        rotate: 0.3 0.9 -0.2 35deg;
      }

      100% {
        rotate: -0.6 0.4 0.5 75deg;
      }
    }
  </style>

</head>

<body>
  <div id="particles"></div>

  <header>
    <h1><span class="title-initial">e</span><span class="title-rest">tERNity</span></h1>
  </header>

  <main>

    <div class="action">
      <button id="update-tracker">Update tracker</button>
      <p class="action-desc">Click "Update tracker" to get the latest changes from the template.<br>
      Current template version: <?= templateVersion ?></p>
    </div>
    </div>

    <div class="action">
      <button id="import-progress">Import progress</button>
      <p
        class="action-desc">Click "Import progress" to transfer your achievement progress from an old Wonders of the World checklist.</p>
    </div>

  </main>

  <footer>
    <small>
      Version <?= bundleVersion ?><br>
      by L1M17LE55
    </small>
  </footer>

  <script>
    function disableButtons(disabled) {
      document.querySelectorAll('button').forEach((button) => {
        button.disabled = disabled
      })
    }

    const updateButton = document.getElementById('update-tracker')
    updateButton.addEventListener('click', () => {
      disableButtons(true)

      google.script.run
        .withSuccessHandler(() => {
          disableButtons(false)
        })
        .withFailureHandler((error) => {
          disableButtons(false)
          console.error(error)
        })
        .invoke('updateTracker')
    })

    const importButton = document.getElementById('import-progress')
    importButton.addEventListener('click', () => {
      disableButtons(true)

      google.script.run
        .withSuccessHandler(() => {
          disableButtons(false)
        })
        .withFailureHandler((error) => {
          disableButtons(false)
          console.error(error)
        })
        .invoke('importProgress')
    })
  </script>

  <script>
    const currentVersion = document.getElementById('current-version');
    const availableVersion = document.getElementById('available-version');

    if (availableVersion.textContent.trim() > currentVersion.textContent.trim()) {
      availableVersion.classList.add('version-newer');
    }
  </script>

  <script>
    const container = document.getElementById('particles')
    const petalCount = 9

    for (let i = 0; i < petalCount; i++) {
      const p = document.createElement('span')
      p.className = 'petal'

      p.style.left = (-15 + Math.random() * 110) + '%'

      const depth = Math.random()

      const scale = (0.55 + depth * 0.6).toFixed(2)
      p.style.scale = scale
      p.style.setProperty('--max-opacity', (0.35 + depth * 0.45).toFixed(2))

      if (depth < 0.4) {
        p.style.filter = 'blur(1px)'
      }

      const fallSpeed = (24 - depth * 6 + Math.random() * 4).toFixed(1) + 's'
      const driftSpeed = (4.5 + Math.random() * 3).toFixed(1) + 's'
      const tumbleSpeed = (4.0 + Math.random() * 3.5).toFixed(1) + 's'

      p.style.animationDuration = `${fallSpeed}, ${driftSpeed}, ${tumbleSpeed}`

      const fallDelay = (-Math.random() * 24).toFixed(1) + 's'
      const driftDelay = (-Math.random() * 7).toFixed(1) + 's'
      const tumbleDelay = (-Math.random() * 7).toFixed(1) + 's'
      p.style.animationDelay = `${fallDelay}, ${driftDelay}, ${tumbleDelay}`

      const windDrift = Math.round(45 + depth * 45 + Math.random() * 25) + 'px'
      p.style.setProperty('--wind-drift', windDrift)

      const r1 = Math.round(65 + Math.random() * 20)
      const r2 = Math.round(15 + Math.random() * 20)
      p.style.borderRadius = `${r1}% ${r2}% ${r1}% ${r2}%`

      container.appendChild(p)
    }
  </script>

</body>

</html>
