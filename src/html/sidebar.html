<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons.css">
  <title>Eternity Sidebar</title>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .sidebar-footer {
      margin-top: auto;
    }
  </style>

</head>

<body>
  <main>
    <button id="update-tracker">Update tracker</button>
    <button id="import-progress">Import progress</button>

    <script>
      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach((button) => {
          button.disabled = disabled
        })
      }

      const updateButton = document.getElementById('update-tracker')
      updateButton.addEventListener('click', () => {
        disableButtons(true)

        google.script.run
          .withSuccessHandler(() => {
            disableButtons(false)
          })
          .withFailureHandler((error) => {
            disableButtons(false)
            console.error(error)
          })
          .invoke('showModal', 'updateTracker')
      })

      const importButton = document.getElementById('import-progress')
      importButton.addEventListener('click', () => {
        disableButtons(true)

        google.script.run
          .withSuccessHandler(() => {
            disableButtons(false)
          })
          .withFailureHandler((error) => {
            disableButtons(false)
            console.error(error)
          })
          .invoke('promptForImportUrl')
      })
    </script>

  </main>

  <footer class="sidebar-footer">
    <span>Version
      <?= version ?>
    </span>
  </footer>

</body>

</html>
