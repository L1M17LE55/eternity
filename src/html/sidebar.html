<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eternity Sidebar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      background-image: url('https://raw.githubusercontent.com/L1M17LE55/eternity/refs/heads/dev/assets/sidebar-background.webp');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .sidebar-header {
      z-index: 2;
      margin-bottom: 28px;
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff5fb;
      text-shadow:
        0 0 10px rgba(255, 135, 205, 0.9),
        0 0 22px rgba(244, 114, 182, 0.65),
        0 1px 4px rgba(0, 0, 0, 0.45);
    }

    main {
      flex: 1;
      z-index: 2;
    }

    .sidebar-buttons {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sidebar-action {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .sidebar-action button {
      width: 100%;
      padding: 11px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 194, 230, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff7fc;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255, 130, 205, 0.9),
        0 0 16px rgba(244, 114, 182, 0.6);
      box-shadow: 0 0 14px rgba(255, 145, 210, 0.15);
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease, text-shadow 0.2s ease, transform 0.15s ease;
    }

    .sidebar-action button:hover:not(:disabled) {
      background: rgba(255, 180, 225, 0.25);
      box-shadow: 0 0 22px rgba(255, 130, 205, 0.5);
      text-shadow:
        0 0 10px rgba(255, 150, 215, 1),
        0 0 22px rgba(244, 114, 182, 0.85);
    }

    .sidebar-action button:active:not(:disabled) {
      background: rgba(255, 180, 225, 0.34);
      transform: scale(0.98);
    }

    .sidebar-action button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .sidebar-action p {
      margin-top: 9px;
      padding: 0 6px;
      font-size: 12px;
      line-height: 1.45;
      color: #fff5fb;
      text-shadow:
        0 0 10px rgba(255, 135, 205, 0.75),
        0 1px 3px rgba(0, 0, 0, 0.65);
    }

    .sidebar-footer {
      margin-top: auto;
      z-index: 2;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffe8f6;
      text-shadow:
        0 0 10px rgba(255, 135, 205, 0.8),
        0 1px 3px rgba(0, 0, 0, 0.7);
    }
  </style>

  <style>
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
      perspective: 700px;
    }

    .petal {
      position: absolute;
      top: -20px;
      width: 11px;
      height: 7px;
      background: linear-gradient(135deg, #fff2f9 0%, #ffc2e6 65%, #f495ce 100%);
      border-radius: 80% 15% 75% 25% / 75% 25% 80% 15%;
      box-shadow: 0 0 6px 1px rgba(255, 175, 230, 0.4);
      transform-style: preserve-3d;

      animation:
        fallDown linear infinite,
        horizontalDrift ease-in-out infinite alternate,
        tumble3D ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes fallDown {
      0% {
        transform: translate3d(0, -30px, 0);
        opacity: 0;
      }

      15% {
        opacity: var(--max-opacity, 0.8);
      }

      85% {
        opacity: var(--max-opacity, 0.75);
      }

      100% {
        transform: translate3d(var(--wind-drift, 80px), 108vh, 0);
        opacity: 0;
      }
    }

    @keyframes horizontalDrift {
      0% {
        margin-left: -12px;
      }

      100% {
        margin-left: 12px;
      }
    }

    @keyframes tumble3D {
      0% {
        rotate: 0.8 0.5 0.2 -28deg;
      }

      50% {
        rotate: 0.3 0.9 -0.2 35deg;
      }

      100% {
        rotate: -0.6 0.4 0.5 75deg;
      }
    }
  </style>

</head>

<body>
  <div id="particles"></div>

  <header class="sidebar-header">
    <h1>Eternity</h1>
  </header>

  <main>

    <div class="sidebar-buttons">

      <div class="sidebar-action">
        <button id="update-tracker">Update tracker</button>
        <p>Genshin Impact v
          <?= gameVersion ?> achievements are available!
        </p>
      </div>

      <div class="sidebar-action">
        <button id="import-progress">Import progress</button>
        <p>Transfer your achievement progress from your old Wonders of the World checklist.</p>
      </div>

    </div>

  </main>

  <footer class="sidebar-footer">
    Version
    <?= bundleVersion ?>
  </footer>

  <script>
    function disableButtons(disabled) {
      document.querySelectorAll('button').forEach((button) => {
        button.disabled = disabled
      })
    }

    const updateButton = document.getElementById('update-tracker')
    updateButton.addEventListener('click', () => {
      disableButtons(true)

      google.script.run
        .withSuccessHandler(() => {
          disableButtons(false)
        })
        .withFailureHandler((error) => {
          disableButtons(false)
          console.error(error)
        })
        .invoke('updateTracker')
    })

    const importButton = document.getElementById('import-progress')
    importButton.addEventListener('click', () => {
      disableButtons(true)

      google.script.run
        .withSuccessHandler(() => {
          disableButtons(false)
        })
        .withFailureHandler((error) => {
          disableButtons(false)
          console.error(error)
        })
        .invoke('importProgress')
    })
  </script>

  <script>
    const container = document.getElementById('particles')
    const petalCount = 9

    for (let i = 0; i < petalCount; i++) {
      const p = document.createElement('span')
      p.className = 'petal'

      p.style.left = (-15 + Math.random() * 110) + '%'

      const depth = Math.random()

      const scale = (0.55 + depth * 0.6).toFixed(2)
      p.style.scale = scale
      p.style.setProperty('--max-opacity', (0.35 + depth * 0.45).toFixed(2))

      if (depth < 0.4) {
        p.style.filter = 'blur(1px)'
      }

      const fallSpeed = (24 - depth * 6 + Math.random() * 4).toFixed(1) + 's'
      const driftSpeed = (4.5 + Math.random() * 3).toFixed(1) + 's'
      const tumbleSpeed = (4.0 + Math.random() * 3.5).toFixed(1) + 's'

      p.style.animationDuration = `${fallSpeed}, ${driftSpeed}, ${tumbleSpeed}`

      const fallDelay = (-Math.random() * 24).toFixed(1) + 's'
      const driftDelay = (-Math.random() * 7).toFixed(1) + 's'
      const tumbleDelay = (-Math.random() * 7).toFixed(1) + 's'
      p.style.animationDelay = `${fallDelay}, ${driftDelay}, ${tumbleDelay}`

      const windDrift = Math.round(45 + depth * 45 + Math.random() * 25) + 'px'
      p.style.setProperty('--wind-drift', windDrift)

      const r1 = Math.round(65 + Math.random() * 20)
      const r2 = Math.round(15 + Math.random() * 20)
      p.style.borderRadius = `${r1}% ${r2}% ${r1}% ${r2}%`

      container.appendChild(p)
    }
  </script>

</body>

</html>
